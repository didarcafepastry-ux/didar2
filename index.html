<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بن کارکنان ایساکو مکی</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f5f5;color:#222}
.wrap{max-width:430px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 25px #00000012}
h1{font-size:22px;margin:0 0 8px;text-align:center}h2{font-size:18px;margin:0 0 12px}
.sub{text-align:center;color:#777;font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;margin:12px 0 6px}
input{width:100%;height:52px;border:1px solid #ddd;border-radius:12px;padding:0 14px;font-size:20px;text-align:center;letter-spacing:7px}
button{width:100%;height:52px;border:0;border-radius:12px;background:#222;color:#fff;font-size:16px;margin-top:16px}
button:disabled{opacity:.55}.msg{margin-top:14px;text-align:center;font-size:13px;min-height:20px}.err{color:#b00020}.ok{color:#087f3d}
.info{background:#fafafa;border-radius:14px;padding:14px;margin-top:16px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0;font-size:14px}.row:last-child{border:0}
.amount{font-size:20px;font-weight:bold}.small{font-size:12px;color:#777;text-align:center;margin-top:18px;line-height:1.8}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>بن کارکنان ایساکو مکی</h1>
<div class="sub">سامانه اعتبار کارکنان کافه پیستری دیدار</div>

<section id="setup" class="hidden">
<h2>انتخاب PIN شخصی</h2>
<div class="sub">برای استفاده‌های بعدی یک PIN چهاررقمی انتخاب کنید.</div>
<label>PIN چهاررقمی</label>
<input id="pin1" inputmode="numeric" maxlength="4" autocomplete="new-password">
<label>تکرار PIN</label>
<input id="pin2" inputmode="numeric" maxlength="4" autocomplete="new-password">
<button id="saveBtn">ثبت PIN</button>
<div id="setupMsg" class="msg"></div>
</section>

<section id="login" class="hidden">
<h2>ورود با PIN</h2>
<div class="sub">PIN چهاررقمی خود را وارد کنید.</div>
<label>PIN</label>
<input id="pin" inputmode="numeric" maxlength="4" autocomplete="current-password">
<button id="loginBtn">نمایش اعتبار</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="result" class="hidden">
<h2 id="name"></h2>
<div class="info">
<div class="row"><span>کد پرسنلی</span><b id="code"></b></div>
<div class="row"><span>اعتبار ماه</span><b id="credit"></b></div>
<div class="row"><span>مصرف‌شده</span><b id="spent"></b></div>
<div class="row"><span>مانده</span><b class="amount" id="remaining"></b></div>
</div>
<div class="small">اعتبار بر اساس اطلاعات سامانه نمایش داده می‌شود.</div>
</section>

<div id="globalMsg" class="msg err"></div>
</div></div>

<script>
const {createClient}=supabase;
const db=createClient(
"https://oufeyhofmkrexmfqctpi.supabase.co",
"sb_publishable_PXwUt-GlO1bOM-aefIPzVQ_LI5p1BJc"
);

const params=new URLSearchParams(location.search);
const code=(params.get("code")||"").trim().toUpperCase();

const setup=document.getElementById("setup");
const login=document.getElementById("login");
const result=document.getElementById("result");
const globalMsg=document.getElementById("globalMsg");

function money(n){return new Intl.NumberFormat("fa-IR").format(Number(n||0))+" تومان"}
function show(el){el.classList.remove("hidden")}
function hide(el){el.classList.add("hidden")}
function msg(el,text,ok=false){el.textContent=text;el.className="msg "+(ok?"ok":"err")}

async function start(){
if(!/^DID-\d{3}$/.test(code)){
globalMsg.textContent="کد کارمند در لینک QR معتبر نیست.";
return;
}
const {data,error}=await db.rpc("employee_pin_status",{p_employee_code:code});
if(error){globalMsg.textContent="ارتباط با سامانه برقرار نشد.";return}
if(data===false) show(setup); else show(login);
}

async function savePin(){
const a=document.getElementById("pin1").value;
const b=document.getElementById("pin2").value;
const m=document.getElementById("setupMsg");
if(!/^\d{4}$/.test(a)){msg(m,"PIN باید دقیقاً ۴ رقم باشد.");return}
if(a!==b){msg(m,"دو PIN یکسان نیستند.");return}
document.getElementById("saveBtn").disabled=true;
const {data,error}=await db.rpc("set_employee_pin",{p_employee_code:code,p_pin:a});
document.getElementById("saveBtn").disabled=false;
if(error||data!==true){
msg(m,"ثبت PIN انجام نشد. اگر قبلاً PIN ثبت شده، از صفحه ورود استفاده کنید.");
return;
}
hide(setup);show(login);
msg(document.getElementById("loginMsg"),"PIN با موفقیت ثبت شد.",true);
}

async function loginPin(){
const p=document.getElementById("pin").value;
const m=document.getElementById("loginMsg");
if(!/^\d{4}$/.test(p)){msg(m,"PIN باید ۴ رقم باشد.");return}
document.getElementById("loginBtn").disabled=true;
const {data,error}=await db.rpc("get_employee_status",{p_employee_code:code,p_pin:p});
document.getElementById("loginBtn").disabled=false;
if(error||!data){msg(m,"PIN اشتباه است یا دسترسی موقتاً محدود شده
