<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست اتصال دیدار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="font-family:Tahoma;padding:25px">
<h2>تست سامانه دیدار</h2>
<div id="status">در حال بررسی...</div>

<script>
(async function(){

const box=document.getElementById("status");

try{

box.innerHTML="مرحله ۱: کتابخانه Supabase...";

if(typeof supabase==="undefined"){
throw new Error("کتابخانه Supabase لود نشد");
}

box.innerHTML+="<br>✅ کتابخانه Supabase لود شد";

const db=supabase.createClient(
"https://oufeyhofmkrexmfqctpi.supabase.co",
"sb_publishable_PXwUt-GlO1bOM-aefIPzVQ_LI5p1BJc"
);

box.innerHTML+="<br>مرحله ۲: اتصال به Supabase...";

const {data,error}=await db.rpc(
"employee_pin_status",
{p_employee_code:"DID-001"}
);

if(error){
throw new Error(
"RPC Error: "+error.message+
" | code: "+(error.code||"")
);
}

box.innerHTML+=
"<br>✅ اتصال موفق است"+
"<br>مرحله ۳: نتیجه DID-001 = "+
String(data);

}catch(e){

box.innerHTML+=
"<br><br>❌ خطا:<br><b>"+
String(e.message||e)+
"</b>";

}

})();
</script>

</body>
</html>
